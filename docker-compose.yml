version: "3.8"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: founder_crm
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: founder_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
